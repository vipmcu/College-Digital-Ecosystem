global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "api-gateway"
    static_configs:
      - targets: ["host.docker.internal:4000"]
  - job_name: "services"
    static_configs:
      - targets:
          - "host.docker.internal:4001"
          - "host.docker.internal:4002"
          - "host.docker.internal:4003"
          - "host.docker.internal:4004"
